name: "Terraform Infrastructure Deployment"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Sub Claim
        run: |
          # Fetch the raw JWT token from GitHub's OIDC provider
          ACTIONS_ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Decode the payload without needing secret keys
          echo "Your exact token payload:"
          echo "$ACTIONS_ID_TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526727148285:role/GitHubActionsTerraformRole # AWS IAM Role ARN
          aws-region: ap-south-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: 1.8.0 

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format & Validate
        run: |
          terraform fmt -check
          terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        # Executes apply ONLY if code was merged into main (not on PR checks)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve # Applies changes to AWS without manual interactive confirmation
